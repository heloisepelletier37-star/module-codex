<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compteur de clics</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f5ff; color: #202747; font-family: system-ui, sans-serif; }
  main { padding: 40px; text-align: center; background: white; border-radius: 24px; box-shadow: 0 12px 40px #20274712; }
  h1 { font-size: 24px; }
  output { display: block; margin: 24px; font-size: 72px; font-weight: bold; }
  button { padding: 14px 22px; border: 0; border-radius: 12px; background: #5546df; color: white; font: inherit; cursor: pointer; }
  button:hover { background: #4032bf; }
  #reset { display: block; margin: 16px auto 0; background: transparent; color: #5546df; }
</style>
<main>
  <h1>Compteur de clics</h1>
  <output id="count" aria-live="polite">0</output>
  <button id="click" type="button">Clique ici +1</button>
  <button id="reset" type="button">Remettre à zéro</button>
</main>
<script>
  let clicks = 0;
  const count = document.getElementById('count');
  document.getElementById('click').addEventListener('click', () => {
    count.textContent = ++clicks;
  });
  document.getElementById('reset').addEventListener('click', () => {
    clicks = 0;
    count.textContent = clicks;
  });
</script>
</html>
